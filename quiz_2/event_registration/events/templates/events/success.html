<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Confirmed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gold: #C9A96E;
      --gold-light: #E8D5B0;
      --bg: #0C0D0F;
      --surface: #141619;
      --surface-2: #1C1F23;
      --border: rgba(201, 169, 110, 0.18);
      --text: #F5F0E8;
      --text-muted: #8A8680;
      --text-dim: #4A4845;
    }

    html,
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    /* Atmospheric background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 50% 40%, rgba(201, 169, 110, 0.05) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 10% 90%, rgba(201, 169, 110, 0.03) 0%, transparent 60%);
      pointer-events: none;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(201, 169, 110, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201, 169, 110, 0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 56px 48px;
      text-align: center;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    /* Animated checkmark */
    .check-wrap {
      position: relative;
      width: 80px;
      height: 80px;
      margin: 0 auto 32px;
    }

    .check-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid var(--border);
      animation: ringExpand 0.6s ease both;
    }

    @keyframes ringExpand {
      from {
        transform: scale(0.6);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .check-circle {
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      background: rgba(201, 169, 110, 0.12);
      border: 1px solid rgba(201, 169, 110, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: circleIn 0.5s ease 0.2s both;
    }

    @keyframes circleIn {
      from {
        transform: scale(0);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .check-mark {
      font-size: 26px;
      animation: checkIn 0.4s ease 0.45s both;
    }

    @keyframes checkIn {
      from {
        transform: scale(0) rotate(-20deg);
        opacity: 0;
      }

      to {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    /* Pulse rings */
    .pulse-ring {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 1px solid rgba(201, 169, 110, 0.15);
      animation: pulseRing 2.5s ease-out 0.8s infinite;
    }

    .pulse-ring-2 {
      position: absolute;
      inset: -24px;
      border-radius: 50%;
      border: 1px solid rgba(201, 169, 110, 0.08);
      animation: pulseRing 2.5s ease-out 1.2s infinite;
    }

    @keyframes pulseRing {
      0% {
        transform: scale(0.95);
        opacity: 0.8;
      }

      100% {
        transform: scale(1.15);
        opacity: 0;
      }
    }

    .ticket-no {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
      animation: fadeUp 0.5s ease 0.6s both;
    }

    .heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: 36px;
      font-weight: 300;
      color: var(--text);
      line-height: 1.15;
      margin-bottom: 12px;
      animation: fadeUp 0.5s ease 0.65s both;
    }

    .heading em {
      font-style: italic;
      color: var(--gold);
    }

    .sub {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.65;
      margin-bottom: 40px;
      animation: fadeUp 0.5s ease 0.7s both;
    }

    /* Info pills */
    .info-strip {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 36px;
      animation: fadeUp 0.5s ease 0.75s both;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 7px 14px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .pill-icon {
      font-size: 13px;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 0 -48px 28px;
      animation: fadeIn 0.4s ease 0.8s both;
    }

    .actions {
      display: flex;
      gap: 10px;
      animation: fadeUp 0.5s ease 0.85s both;
    }

    .btn-primary {
      flex: 1;
      height: 48px;
      background: var(--gold);
      border: none;
      border-radius: 10px;
      color: #0C0D0F;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.15s;
    }

    .btn-primary:hover {
      background: var(--gold-light);
      transform: translateY(-1px);
    }

    .btn-ghost {
      flex: 1;
      height: 48px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, color 0.2s, transform 0.15s;
    }

    .btn-ghost:hover {
      border-color: rgba(201, 169, 110, 0.4);
      color: var(--gold);
      transform: translateY(-1px);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div class="grid-bg"></div>
  <div class="card">
    <div class="check-wrap">
      <div class="pulse-ring"></div>
      <div class="pulse-ring-2"></div>
      <div class="check-ring"></div>
      <div class="check-circle">
        <span class="check-mark">✓</span>
      </div>
    </div>

    <p class="ticket-no">Registration Confirmed</p>
    <h1 class="heading">You're <em>in.</em></h1>
    <p class="sub">
      Your spot at the Annual Design &amp; Innovation Summit has been secured. Check your inbox for a confirmation email
      with further details.
    </p>



    <div class="divider"></div>

    <div class="actions">
      <a href="{% url 'register' %}" class="btn-ghost">Register Another</a>
      <a href="#" class="btn-primary">View Event Details</a>
    </div>
  </div>
</body>

</html>
